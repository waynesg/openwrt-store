name: Build IPK

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package name (e.g., luci-app-autoupdate)'
        required: true
        type: string
      repo:
        description: 'GitHub repo (owner/repo, e.g., waynesg/luci-app-autoupdate)'
        required: true
        type: string
      branch:
        description: 'Branch or tag'
        required: false
        type: string
        default: 'main'
      target:
        description: 'Target (x86_64, aarch64)'
        required: false
        type: string
        default: 'x86_64'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone package source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.repo }}
          ref: ${{ github.event.inputs.branch }}
          path: package

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache flex bison libssl-dev \
            libelf-dev autoconf automake libtool pkg-config zlib1g-dev \
            libncurses5-dev git curl wget gawk

      - name: Clone ImmortalWrt
        run: |
          git clone -b openwrt-24.10 --depth 1 \
            https://github.com/immortalwrt/immortalwrt.git ~/openwrt

      - name: Setup feeds
        run: |
          cd ~/openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy package
        run: |
          cd ~/openwrt
          PKG="${{ github.event.inputs.package }}"

          rm -rf package/$PKG

          if [ -f "${{ github.workspace }}/package/Makefile" ]; then
            mkdir -p package/$PKG
            cp -r ${{ github.workspace }}/package/* package/$PKG/
          elif [ -f "${{ github.workspace }}/package/$PKG/Makefile" ]; then
            cp -r ${{ github.workspace }}/package/$PKG package/$PKG
          else
            echo "ERROR: Cannot find package Makefile"
            find ${{ github.workspace }}/package -maxdepth 4 -type f -name Makefile -print
            exit 1
          fi

          echo "=== Package tree ==="
          find package/$PKG -maxdepth 3 -type f | sort
          test -f package/$PKG/Makefile

      - name: Build
        run: |
          cd ~/openwrt
          PKG="${{ github.event.inputs.package }}"

          echo "CONFIG_PACKAGE_${PKG}=m" >> .config
          make defconfig

          make package/$PKG/compile V=s

          find /home/runner/openwrt/bin/packages -name "*${PKG}*.ipk" -print

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.package }}-${{ github.event.inputs.target }}
          path: /home/runner/openwrt/bin/packages/**/${{ github.event.inputs.package }}*.ipk
          retention-days: 5
